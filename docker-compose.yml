services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      STATE_DB: /state/state.sqlite3
      DEMO_USERS_FILE: /state/demo_users.json
      INDEX_DIR: /state/vector_store
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - state:/state
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
volumes:
  state:
