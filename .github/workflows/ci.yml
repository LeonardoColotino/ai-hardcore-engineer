name: candidate-engineering
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=evidence/current/pytest.xml
      - run: python -m evaluation.run
      - run: python scripts/release_manifest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-evidence
          path: |
            evidence/current/
            evaluation/report.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/docker_smoke.py
